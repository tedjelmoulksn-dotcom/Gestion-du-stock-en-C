<svg xmlns="http://www.w3.org/2000/svg" width="960" height="478" viewBox="0 0 960 478" role="img" aria-labelledby="title desc"><title id="title">Pointer-based inventory sorting</title><desc id="desc">Node addresses are reordered; product payloads stay in place. Doubly linked list: first / last · next / previous links. Temporary pointer array: Collect addresses of existing nodes. qsort callbacks: Compare names, prices or quantities. List reconstruction: Reassign endpoints and neighbour links</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#536d83"/></marker></defs><rect width="960" height="478" rx="18" fill="#f4f7fb"/><text x="48" y="48" font-family="sans-serif" font-size="26" font-weight="700" fill="#132b42">Pointer-based inventory sorting</text><text x="48" y="78" font-family="sans-serif" font-size="16" fill="#52677b">Node addresses are reordered; product payloads stay in place</text><path d="M456 173 L499 173" fill="none" stroke="#536d83" stroke-width="2" marker-end="url(#arrow)"/><path d="M708 234 L252 295" fill="none" stroke="#536d83" stroke-width="2" marker-end="url(#arrow)"/><path d="M456 361 L499 361" fill="none" stroke="#536d83" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="112" width="408" height="122" rx="12" fill="#ffffff" stroke="#c8d6e3"/><rect x="48" y="112" width="6" height="122" rx="3" fill="#176b9c"/><text x="70" y="146" font-family="sans-serif" font-size="19" font-weight="700" fill="#17354f">Doubly linked list</text><text x="70" y="177" font-family="sans-serif" font-size="15" fill="#475f74">first / last · next / previous links</text><rect x="504" y="112" width="408" height="122" rx="12" fill="#ffffff" stroke="#c8d6e3"/><rect x="504" y="112" width="6" height="122" rx="3" fill="#176b9c"/><text x="526" y="146" font-family="sans-serif" font-size="19" font-weight="700" fill="#17354f">Temporary pointer array</text><text x="526" y="177" font-family="sans-serif" font-size="15" fill="#475f74">Collect addresses of existing nodes</text><rect x="48" y="300" width="408" height="122" rx="12" fill="#ffffff" stroke="#c8d6e3"/><rect x="48" y="300" width="6" height="122" rx="3" fill="#176b9c"/><text x="70" y="334" font-family="sans-serif" font-size="19" font-weight="700" fill="#17354f">qsort callbacks</text><text x="70" y="365" font-family="sans-serif" font-size="15" fill="#475f74">Compare names, prices or quantities</text><rect x="504" y="300" width="408" height="122" rx="12" fill="#ffffff" stroke="#c8d6e3"/><rect x="504" y="300" width="6" height="122" rx="3" fill="#176b9c"/><text x="526" y="334" font-family="sans-serif" font-size="19" font-weight="700" fill="#17354f">List reconstruction</text><text x="526" y="365" font-family="sans-serif" font-size="15" fill="#475f74">Reassign endpoints and neighbour links</text></svg>
